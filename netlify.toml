[images]
  remote_images = ['https://images\.unsplash\.com/.*']

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/articoli/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/redazione"
  to = "/redazione.html"
  status = 301

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 301

[[redirects]]
  from = "/giochi"
  to = "/giochi.html"
  status = 301
