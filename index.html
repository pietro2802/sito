
<section class="ng-panel" style="margin:28px auto 0;max-width:1180px;padding:22px">
  <div class="ng-kicker">NEWSLETTER · FACOLTATIVA</div>

  <h2 style="margin:7px 0">
    Il riepilogo gaming della settimana
  </h2>

  <p style="color:#a9b7c9">
    Iscriviti per ricevere le novità gaming di NEWSGAMING2.
    L'iscrizione richiede conferma email e puoi disiscriverti in qualsiasi momento.
  </p>

  <form id="ngNewsletterForm" style="display:flex;gap:10px;flex-wrap:wrap">
    <input
      id="ngNewsletterEmail"
      type="email"
      required
      autocomplete="email"
      placeholder="La tua email"
      style="flex:1;min-width:220px;padding:12px;border-radius:10px;border:1px solid #29405a;background:#091421;color:#fff"
    >

    <input
      id="ngNewsletterWebsite"
      type="text"
      tabindex="-1"
      autocomplete="off"
      aria-hidden="true"
      style="position:absolute;left:-9999px"
    >

    <label style="display:flex;align-items:center;gap:7px;font-size:.78rem;color:#b9c9d9">
      <input id="ngNewsletterConsent" type="checkbox" required>
      Accetto di ricevere la newsletter
    </label>

    <button class="ng-btn" type="submit">
      Iscriviti
    </button>
  </form>

  <p id="ngNewsletterMsg" class="muted" aria-live="polite"></p>
</section>

<script>
(() => {
  const form = document.getElementById('ngNewsletterForm');

  if (!form) return;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const msg = document.getElementById('ngNewsletterMsg');
    const button = form.querySelector('button[type="submit"]');

    const email = document.getElementById('ngNewsletterEmail').value.trim();
    const website = document.getElementById('ngNewsletterWebsite').value;
    const consent = document.getElementById('ngNewsletterConsent').checked;

    if (!consent) {
      msg.textContent = 'Devi accettare di ricevere la newsletter.';
      return;
    }

    button.disabled = true;
    msg.textContent = 'Invio in corso...';

    try {
      const response = await fetch('/api/newsletter-subscribe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email,
          website,
          consent
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || 'Errore durante l’iscrizione.');
      }

      msg.textContent = result.message || 'Controlla la tua email per confermare.';
      form.reset();

    } catch (error) {
      msg.textContent = error.message || 'Errore di connessione. Riprova.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
