
name: Newsletter - nuovo articolo

'on':
  push:
    branches:
      - main
    paths:
      - 'articoli/*.html'
      - 'articoli/**/*.html'
      - '.github/workflows/newsletter-on-new-article.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Invia notifiche per i nuovi articoli o modifiche
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.NEWSLETTER_PUBLISH_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Primo commit: nessun invio automatico di tutti gli articoli."
            exit 0
          fi

          git diff --diff-filter=AM --name-only "$BEFORE" "$AFTER" -- 'articoli/*.html' 'articoli/**/*.html' > /tmp/articles.txt

          if [[ ! -s /tmp/articles.txt ]]; then
            echo "Nessun articolo nuovo o modificato."
            exit 0
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Notifica per: $file"
            node scripts/notify-new-article.js "$file"
          done < /tmp/articles.txt
